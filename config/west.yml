manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: am
      url-base: https://github.com/am
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned to v0.3: nice-view-strata needs LVGL 8 (ZMK main moved to LVGL 9),
      # and the custom boards here use the Zephyr 3.5 board layout.
      revision: v0.3
      import: app/west.yml
    - name: nice-view-strata
      remote: am
      revision: main
  self:
    path: config
